# kumaUI talks to Ollama on the host so Mac GPU / Metal still works.
# Start Ollama first (`ollama serve` or the desktop app), then:
#   docker compose up --build
#
# Linux: if the UI cannot reach Ollama, bind the daemon to all interfaces:
#   OLLAMA_HOST=0.0.0.0:11434 ollama serve

services:
  web:
    build: .
    image: kumaui:local
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_TIMEOUT_MS: ${OLLAMA_TIMEOUT_MS:-600000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
